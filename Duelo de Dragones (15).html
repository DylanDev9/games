function pause(){if(NET.on){document.getElementById('box').innerHTML='<h2>👥 Multijugador</h2><button onclick="hide()">▶ Seguir</button><br><button onclick="netLeave()">🏠 Salir de la partida</button>';show();return;}if(state=='play'){state='pause';pauseMenu();}else if(state=='pause')resume();}
function resume(){hide();state='play';last=performance.now();requestAnimationFrame(loop);}
function pick(w){let h=BK('shop('+w+')')+'<h2>🧍 Elige tu personaje</h2><div style="display:grid;grid-template-columns:1fr 1fr;gap:6px">';chars.forEach((c,i)=>{h+='<button onclick="me=chars['+i+'];pick('+w+')"'+(me==c?' style="outline:3px solid #fff"':'')+'>'+c.n+'</button>';});h+='</div><button onclick="shop('+w+')">Listo</button>';document.getElementById('box').innerHTML=h;show();}
function skins(b){let h=BK(b<0?'toSel()':'shop('+b+')')+'<h2>🎨 Elige la skin de tu palo</h2><div style="display:grid;grid-template-columns:1fr 1fr;gap:6px">';
 SN.forEach((n,i)=>{h+='<button onclick="SKIN='+i+';skins('+b+')" style="background:'+SK[i]+';color:#fff;'+(SKIN==i?'outline:3px solid #fff;':'')+'">'+n+(false?' ⭐':'')+'</button>';});
 h+='</div><p>Elegida: <b>'+SN[SKIN]+'</b></p><button onclick="'+(b<0?'newRound()':'shop('+b+')')+'">'+(b<0?'¡Jugar!':'Listo')+'</button>'+(b<0?' <button onclick="netMenu()">👥 Multijugador</button>':'');
 document.getElementById('box').innerHTML=h;show();}
function shop(win){const bx=document.getElementById('box');if(/Victoria|Perdiste/.test(bx.innerHTML))ENDH=bx.innerHTML;let h=''+BK(win==2?'pauseMenu()':'backEnd()')+'<h2>🛒 Tienda de palos</h2><p>Aquí compras palos más fuertes.</p><p>Monedas: <b>🪙 '+coins+'</b></p>';
 sticks.forEach((s,i)=>{let b=owned[i]?(cur==i?'<b>✔ Equipado</b>':'<button onclick="eq('+i+','+win+')">Equipar</button>'):'<button onclick="buy('+i+','+win+')">'+s.c+' 🪙</button>';
  h+='<div class="item"><span>'+s.n+'<br><small>Daño '+s.d+'</small></span>'+b+'</div>';});
 h+='<button onclick="skins('+win+')">🎨 Skin del palo</button>';h+='<button onclick="pick('+win+')">🧍 Personaje</button>';if(win==2)h+='<button onclick="pauseMenu()">⬅ Volver</button>';else h+='<button onclick="'+(win?'round++;':'')+'newRound()">'+(win?'Siguiente ronda':'Jugar')+'</button>';
 document.getElementById('box').innerHTML=h;show();}
function buy(i,w){if(coins>=sticks[i].c){coins-=sticks[i].c;owned[i]=true;cur=i;}shop(w);}
function eq(i,w){cur=i;shop(w);}
function show(){document.getElementById('ov').style.display='flex';}
function hide(){document.getElementById('ov').style.display='none';}
const km={ArrowLeft:'l',a:'l',ArrowRight:'r',d:'r',ArrowUp:'u',w:'u',ArrowDown:'d',s:'d'};
addEventListener('keydown',e=>{const k=km[e.key.length>1?e.key:e.key.toLowerCase()];if(k){keys[k]=1;e.preventDefault();}if(e.code=='Space'){attack();e.preventDefault();}if(e.code=='KeyE')special();if(e.key=='Shift'||e.code=='KeyK')dash();if(e.code=='KeyP'||e.key=='Escape')pause();});
addEventListener('keyup',e=>{const k=km[e.key.length>1?e.key:e.key.toLowerCase()];if(k)keys[k]=0;});
function setMP(e){const r=c.getBoundingClientRect();MP.x=(e.clientX-r.left)*800/r.width;MP.y=(e.clientY-r.top)*450/r.height;}
c.addEventListener('pointerdown',e=>{if(e.button==2){RM=true;setMP(e);c.setPointerCapture(e.pointerId);}else attack();});
c.addEventListener('pointermove',e=>{if(e.pointerType=='mouse'){RM=true;setMP(e);}});c.addEventListener('pointerleave',()=>{RM=false;});
addEventListener('pointerup',e=>{});
c.addEventListener('contextmenu',e=>e.preventDefault());
document.querySelectorAll('#pad button').forEach(b=>{const k=b.dataset.k;
 b.addEventListener('pointerdown',ev=>{ev.preventDefault();k=='a'?attack():k=='s'?dash():k=='p'?special():keys[k]=1;});
 ['pointerup','pointerleave','pointercancel'].forEach(n=>b.addEventListener(n,()=>{if(k!='a'&&k!='s'&&k!='p')keys[k]=0;}));});
